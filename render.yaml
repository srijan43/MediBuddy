services:
  # Backend API (Express) - Free Plan Web Service
  - type: web
    name: medibuddy-api
    plan: free
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      # After frontend deploys, set this to your frontend Render URL:
      # e.g. https://medibuddy-web.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # Frontend (Vite + React) - Static Site (free by default)
  - type: web
    name: medibuddy-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA routing: serve index.html for all paths
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend Render URL + /api
      # e.g. https://medibuddy-api.onrender.com/api
      - key: VITE_API_URL
        sync: false          # Set this in Render dashboard
